  <style>
    /* --- リンクの枠（カード）デザインの調整 --- */
/* --- リンクの枠（カード）デザインの調整 --- */
.contents {
  list-style: none; /* リストの点を消す */
  padding: 0;
  margin: 0 auto;
  max-width: 950px;
  width: 100%;
  justify-content: center;
  display: flex;    /* カードを横並びにする */
  flex-wrap: wrap;  /* 画面幅に応じて折り返す */
}

.contents li {
  width: 100%;
  max-width: 900px;
  min-width: 280px;        /* 極端に小さくなるのを防ぐ */
    margin: 0 auto;
}
    .contents li a {
      display: block;              /* 枠全体をクリックできるようにする */
      text-decoration: none;       /* 文字の下線を消す */
      color: #333333;                 /* 文字の色 */
      border: 3px solid grey;      /* 枠線 */
      border-radius: 5px;          /* 枠の角を丸くする */
      overflow: hidden;            /* はみ出た画像を丸角に合わせる */
      background-color: #333333;
      transition: transform 0.2s, box-shadow 0.2s; /* ホバー時のアニメーション */
    }
    /* マウスを乗せたときの動き */
    .contents li a:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    /* カード内の画像 */
    .contents li a img {
      width: 300px;   
      height: 168.75px;            /* 【1.5倍サイズ】画像の高さも1.5倍ほどに拡大 */
      object-fit: cover;           /* 縦横比を崩さずにトリミング */
      display: block;
      margin: 0 auto;   
      margin-top: 15px;           /* 【重要】画像自体をカード内の横中央に配置 */
    }
    /* カード内のテキストエリア */
    .contents li a .work-title {
      padding: 80px 80px 80px 0px;               /* 文字まわりの余白も拡大 */
      font-size: 25px;             /* 文字を少し大きく */
      line-height: 1.9;
            background-image: url("img/title_standard.png");         /* 背景色 */
      text-align: center;          /* 文字を中央寄せ */
      font-weight: bold;
    }
    /* カード内のテキストエリア */

      padding: 80px 80px 80px 0px;               /* 文字まわりの余白も拡大 */

            background-image: url("img/title_headmodel.png");         /* 背景色 */
      text-align: center;          /* 文字を中央寄せ */
      font-weight: bold;
    }
    .catch{
      font-size: 20px;
    }
  </style>
